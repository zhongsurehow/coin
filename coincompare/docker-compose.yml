version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: coincompare-postgres
    environment:
      POSTGRES_DB: coincompare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - coincompare-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: coincompare-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - coincompare-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # InfluxDB Time Series Database
  influxdb:
    image: influxdb:2.7-alpine
    container_name: coincompare-influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin123
      DOCKER_INFLUXDB_INIT_ORG: coincompare
      DOCKER_INFLUXDB_INIT_BUCKET: trading_data
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: coincompare-token-123
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    networks:
      - coincompare-network
    restart: unless-stopped

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coincompare-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres123@postgres:5432/coincompare
      - REDIS_URL=redis://redis:6379/0
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=coincompare-token-123
      - INFLUXDB_ORG=coincompare
      - INFLUXDB_BUCKET=trading_data
      - JWT_SECRET_KEY=your-super-secret-jwt-key-change-in-production
      - ENCRYPTION_KEY=your-32-byte-encryption-key-change-this
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    networks:
      - coincompare-network
    depends_on:
      - postgres
      - redis
      - influxdb
    restart: unless-stopped
    command: python run.py

  # Frontend React Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coincompare-frontend
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_WS_URL=ws://localhost:8000
      - REACT_APP_ENVIRONMENT=development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - coincompare-network
    depends_on:
      - backend
    restart: unless-stopped

  # Celery Worker for Background Tasks
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coincompare-celery-worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres123@postgres:5432/coincompare
      - REDIS_URL=redis://redis:6379/0
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=coincompare-token-123
      - INFLUXDB_ORG=coincompare
      - INFLUXDB_BUCKET=trading_data
      - JWT_SECRET_KEY=your-super-secret-jwt-key-change-in-production
      - ENCRYPTION_KEY=your-32-byte-encryption-key-change-this
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
    volumes:
      - ./backend:/app
      - celery_logs:/app/logs
    networks:
      - coincompare-network
    depends_on:
      - postgres
      - redis
      - influxdb
    restart: unless-stopped
    command: celery -A app.core.celery worker --loglevel=info

  # Celery Beat Scheduler
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coincompare-celery-beat
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres123@postgres:5432/coincompare
      - REDIS_URL=redis://redis:6379/0
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=coincompare-token-123
      - INFLUXDB_ORG=coincompare
      - INFLUXDB_BUCKET=trading_data
      - JWT_SECRET_KEY=your-super-secret-jwt-key-change-in-production
      - ENCRYPTION_KEY=your-32-byte-encryption-key-change-this
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
    volumes:
      - ./backend:/app
      - celery_beat_data:/app/celerybeat-schedule
    networks:
      - coincompare-network
    depends_on:
      - postgres
      - redis
      - influxdb
    restart: unless-stopped
    command: celery -A app.core.celery beat --loglevel=info

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: coincompare-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - coincompare-network
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: coincompare-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - coincompare-network
    depends_on:
      - prometheus
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: coincompare-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    networks:
      - coincompare-network
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  influxdb_data:
  influxdb_config:
  backend_logs:
  celery_logs:
  celery_beat_data:
  prometheus_data:
  grafana_data:

networks:
  coincompare-network:
    driver: bridge